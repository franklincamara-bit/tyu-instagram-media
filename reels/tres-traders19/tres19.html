function slot(i){return {x:SLOT_X0+i*(SLOT_W+SLOT_GAP), y:SLOT_Y, s:SLOT_W/PANEL.w}}

function addRough(node,t0,t1,owner,fillColor){
  owner.g.appendChild(node);
  let paths=[...node.querySelectorAll('path')].filter(p=>p.getAttribute('stroke')&&p.getAttribute('stroke')!=='none');
  if(fillColor){const fills=paths.filter(p=>p.getAttribute('stroke')===fillColor);paths=paths.filter(p=>!fills.includes(p));
    fills.forEach(f=>{f.style.opacity=0;strokes.push({kind:'fade',node:f,t0:t1,t1:t1+0.3})})}
  const lens=paths.map(p=>p.getTotalLength());
  paths.forEach((p,i)=>{p.style.strokeDasharray=lens[i]+' '+(lens[i]+1);p.style.strokeDashoffset=lens[i];p.setAttribute('stroke-linecap','round')});
  strokes.push({kind:'path',paths,lens,total:lens.reduce((a,b)=>a+b,0),t0,t1,owner});
  return node;
}
let CLIP=0;
function addText(str,x,y,size,t0,t1,owner,o={}){

}

/* ---------- render ---------- */
function panelState(P,t){
  // entrada: fade rápido; saída: voa para a miniatura
  let x=PANEL.x,y=PANEL.y,s=1,op=1;
  if(t<P.tIn-0.001&&P.i>0){op=0}
  else if(t<P.tIn+0.25&&P.i>0){op=easeOut(clamp((t-P.tIn)/0.25));s=0.96+0.04*op}
  const fly=0.5;
  if(t>=P.tOut){const k=ease(clamp((t-P.tOut)/fly));const S=slot(P.i);x=PANEL.x+(S.x-PANEL.x)*k;y=PANEL.y+(S.y-PANEL.y)*k;s=1+(S.s-1)*k;P.sh.style.opacity=1-k}
  else P.sh.style.opacity=1;
  const cx=PANEL.w/2*(1-s),cy=PANEL.h/2*(1-s);
  P.wrap.setAttribute('transform',`translate(${x+(t<P.tOut?cx:0)},${y+(t<P.tOut?cy:0)}) scale(${s})`);
  P.wrap.style.opacity=op;
  return {x:x+(t<P.tOut?cx:0),y:y+(t<P.tOut?cy:0),s};
}
function ownerXY(o,t){ if(o===CK||o===END) return {x:0,y:0,s:1}; const P=o.owner||o; return P.__xy }
function rot(px,py,deg,cx,cy){const a=deg*Math.PI/180,dx=px-cx,dy=py-cy;return [cx+dx*Math.cos(a)-dy*Math.sin(a),cy+dx*Math.sin(a)+dy*Math.cos(a)]}

/* ---- lápis: percurso contínuo, com aceleração de mão e voo levantado entre traços ---- */
const smooth=x=>x*x*(3-2*x);
const handEase=(p,k)=>(1-k)*p+k*smooth(p);           // acelera no começo, freia no fim
function panelXY(P,t){ // posição pura do painel (sem efeitos colaterais)
  let x=PANEL.x,y=PANEL.y,s=1;
  if(t>=P.tIn&&t<P.tIn+0.25&&P.i>0){s=0.96+0.04*easeOut(clamp((t-P.tIn)/0.25))}
  if(t>=P.tOut){const k=ease(clamp((t-P.tOut)/0.5));const S=slot(P.i);return {x:PANEL.x+(S.x-PANEL.x)*k,y:PANEL.y+(S.y-PANEL.y)*k,s:1+(S.s-1)*k}}
  return {x:x+PANEL.w/2*(1-s),y:y+PANEL.h/2*(1-s),s};
}
function toGlobal(owner,pt,t){
  let [px,py]=pt;
  if(owner===N4){[px,py]=rot(px,py,-2,480,390);owner=P4}
  if(owner===CK||owner===END)return [px,py];
  const xy=panelXY(owner,t);return [xy.x+px*xy.s,xy.y+py*xy.s];
}
// amostra cada traço: tinta + trechos "no ar" quando o caminho salta (subcaminhos)
function prepPath(s){
  const S=[];let G=0,T=0,last=null;
  s.paths.forEach((pa,i)=>{const L=s.lens[i];const n=Math.max(2,Math.ceil(L/7));
    for(let j=0;j<=n;j++){const d=L*j/n;const q=pa.getPointAtLength(d);
      if(last){const dd=Math.hypot(q.x-last.x,q.y-last.y);
        if(dd>14){T+=dd*0.55;S.push({x:last.x,y:last.y,G,T:T-dd*0.55,air:0});S.push({x:q.x,y:q.y,G,T,air:1})}
        else{const di=Math.min(dd,L/n);G+=di;T+=dd}}
      S.push({x:q.x,y:q.y,G,T,air:0});last=q}
    G=s.lens.slice(0,i+1).reduce((a,b)=>a+b,0);
  });
  s.S=S;s.T=T;s.start=[S[0].x,S[0].y];s.end=[S[S.length-1].x,S[S.length-1].y];
}
function samplePath(s,u){ // u em 0..1 do percurso total
  const T=u*s.T,S=s.S;let lo=0,hi=S.length-1;
  while(hi-lo>1){const m=(lo+hi)>>1;if(S[m].T<=T)lo=m;else hi=m}
  const a=S[lo],b=S[hi],k=b.T>a.T?(T-a.T)/(b.T-a.T):0;
  const inAir=b.air===1&&b.G===a.G&&Math.hypot(b.x-a.x,b.y-a.y)>14;
  return {x:a.x+(b.x-a.x)*k,y:a.y+(b.y-a.y)*k,G:a.G+(b.G-a.G)*k,lift:inAir?Math.sin(Math.PI*k):0};
}
function prepText(s){const b=s.bb=s.bb||s.t.getBBox();const fs=+s.t.getAttribute('font-size');
  s.fs=fs;s.mid=b.y+b.height*0.58;s.start=[b.x,s.mid];s.end=[b.x+b.width,s.mid]}
function textPen(s,p){const b=s.bb,x=b.x+b.width*p,fs=s.fs;
  // laço da escrita preso ao avanço das letras (≈ uma volta por letra)
  const ph=2*Math.PI*(x-b.x)/(fs*0.36);
  return [x+Math.cos(ph)*fs*0.05,s.mid+Math.sin(ph)*fs*0.16]}
const penStrokes=[];
function prepPen(){strokes.forEach(s=>{if(s.nopen||s.kind==='fade')return;
  if(s.kind==='path')prepPath(s);else prepText(s);penStrokes.push(s)});
  penStrokes.sort((a,b)=>a.t0-b.t0);
  // garante tempo de deslocamento entre traços proporcional à distância (mão não teletransporta)
  for(let i=0;i+1<penStrokes.length;i++){const a=penStrokes[i],b=penStrokes[i+1];
    const A=toGlobal(a.owner,a.end,a.t1),B=toGlobal(b.owner,b.start,b.t0);
    const need=Math.max(0.1,Math.hypot(B[0]-A[0],B[1]-A[1])/1500),gap=b.t0-a.t1;
    if(gap<need){const def=need-gap;const ta=Math.min(def/2,0.3*(a.t1-a.t0));const tb=Math.min(def-ta,0.3*(b.t1-b.t0));a.t1-=ta;b.t0+=tb}}}
function strokeP(s,t){const p=clamp((t-s.t0)/(s.t1-s.t0));return s.kind==='text'?handEase(p,0.35):handEase(p,0.7)}
function penAt(t){
  let act=null;for(const s of penStrokes){if(t>=s.t0&&t<s.t1)act=s}
  if(act){const p=strokeP(act,t);
    if(act.kind==='path'){const q=samplePath(act,p);const g=toGlobal(act.owner,[q.x,q.y],t);return {x:g[0],y:g[1],lift:q.lift,op:1}}
    const g=toGlobal(act.owner,textPen(act,p),t);return {x:g[0],y:g[1],lift:0,op:1}}
  let prev=null,next=null;
  for(const s of penStrokes){if(s.t1<=t&&(!prev||s.t1>prev.t1))prev=s;if(s.t0>t&&(!next||s.t0<next.t0))next=s}
  const A=prev&&toGlobal(prev.owner,prev.end,prev.t1), B=next&&toGlobal(next.owner,next.start,next.t0);
  if(prev&&next){const gap=next.t0-prev.t1;
    const fly=Math.min(gap,0.55);const tf=next.t0-fly;
    if(t>=tf){const u=smooth(clamp((t-tf)/fly));const d=Math.hypot(B[0]-A[0],B[1]-A[1]);
      const from=gap>2.2?[B[0]+70,B[1]-90]:A;
      return {x:from[0]+(B[0]-from[0])*u,y:from[1]+(B[1]-from[1])*u,lift:Math.sin(Math.PI*u)*Math.min(1,d/250)+(gap>2.2?1-u:0),op:gap>2.2?clamp((t-tf)/0.2):1}}
    // parado entre traços: levanta um pouco e respira; em pausas longas sai de cena
    const w=t-prev.t1;const lift=Math.min(1,w/0.25)*0.6;
    return {x:A[0]+Math.sin(w*2.1)*4,y:A[1]+Math.cos(w*1.7)*3,lift,op:gap>2.2?1-clamp((w-0.35)/0.25):1}}
  if(prev){const w=t-prev.t1;return {x:A[0],y:A[1],lift:Math.min(1,w/0.25),op:1-clamp((w-0.4)/0.3)}}
  if(next){const w=next.t0-t;return {x:B[0]+70,y:B[1]-90,lift:1,op:1-clamp((w-0.2)/0.2)}}
  return {x:0,y:0,lift:0,op:0};
}
let penReady=false;

window.renderAt=function(t){
  if(!penReady){prepPen();penReady=true}
  panels.forEach(P=>P.__xy=panelState(P,t));
  N4.__xy=P4.__xy;
  for(const s of strokes){
    const p=clamp((t-s.t0)/(s.t1-s.t0));
    if(s.kind==='path'){
      let d;
      if(s.S){const q=samplePath(s,strokeP(s,t));d=p>=1?s.total:(p<=0?0:q.G)}else d=p*s.total;
      s.paths.forEach((pa,i)=>{const L=s.lens[i];const u=clamp(d/L);pa.style.strokeDashoffset=L*(1-u);d-=L});
      s.paths.forEach(pa=>pa.style.visibility=p>0?'visible':'hidden');
    }else if(s.kind==='text'){
      if(!s.bb){s.bb=s.t.getBBox()}
      const b=s.bb;s.r.setAttribute('x',b.x-10);s.r.setAttribute('y',b.y-30);s.r.setAttribute('height',b.height+60);
      const e=p<=0?0:p>=1?1:strokeP(s,t);
      s.r.setAttribute('width',p>=1?b.width+40:Math.max(0,b.width*e+10));
    }else if(s.kind==='fade'){s.node.style.opacity=p}
  }
  // lápis
  const P_=penAt(t), P2_=penAt(t-1/30);
  const vx=P_.x-P2_.x;
  const lean=clamp(vx*0.35,-7,7);
  const lift=P_.lift*22;
  pencil.setAttribute('transform',`translate(${P_.x},${P_.y-lift}) rotate(${lean})`);
  pin.firstChild.setAttribute('cy',34+lift*1.2);pin.firstChild.setAttribute('cx',120-lift*0.6);
  pencil.style.opacity=P_.op;
  updScore(t);
  // checklist e fim
  CK.g.style.opacity=1-clamp((t-END.t0)/0.35);
  END.g.style.opacity=clamp((t-END.t0-0.2)/0.4);
  cap.style.opacity=1-clamp((t-END.t0)/0.25);
  // avatar
  let cur=0;for(let k=0;k<poseTL.length;k++)if(t>=poseTL[k][0])cur=k;
  const since=t-poseTL[cur][0];
  for(const k in imgs)imgs[k].style.opacity=0;
  const im=imgs[poseTL[cur][1]];
  const pop=cur>0?back(clamp(since/0.35)):1;
  const breathe=1+Math.sin(t*2.4)*0.006, sway=Math.sin(t*1.3)*0.6;
  const endShift=t>END.t0?ease(clamp((t-END.t0)/0.6))*-200:0;
  const w=im.naturalWidth*900/im.naturalHeight;
  im.style.left=(AV_CX-w/2+endShift)+'px';
  im.style.opacity=1;
  im.style.transform=`rotate(${sway}deg) scale(${(0.92+0.08*pop)*1},${(0.92+0.08*pop)*breathe})`;
  if(cur>0&&since<0.12){const prev=imgs[poseTL[cur-1][1]];prev.style.opacity=1-since/0.12;prev.style.left=im.style.left}
  // legenda
  let ci=-1;CAPS.forEach((c,k)=>{if(t>=c[0]-0.05&&t<c[1])ci=k});
  if(ci!==capCur){cap.innerHTML=ci>=0?`<span class="box">${CAPS[ci][2]}</span>`:'';capCur=ci}
  if(ci>=0){const u=clamp((t-CAPS[ci][0]+0.05)/0.14);cap.style.transform=`translateY(${(1-u)*14}px)`;cap.style.opacity=Math.min(u,1-clamp((t-END.t0)/0.25))}
};
// exporta a linha do tempo do lápis para o som
window.penIntervals=()=>{if(!penReady){prepPen();penReady=true}return strokes.filter(s=>s.kind!=='fade'&&!s.nopen).map(s=>[s.t0,s.t1,s.kind])};
Promise.all([...document.images].map(i=>i.decode().catch(()=>{}))).then(()=>{document.fonts.ready.then(()=>{renderAt(0);window.READY=true})});
</script></body></html>
